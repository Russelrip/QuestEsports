# Keeps the digest-pinned base images current. A pinned digest never picks up a
# Debian security fix on its own, so Dependabot proposes the new digest weekly
# and CI (including the container config tests) checks it like any other PR.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /frontend
      - /ops/docker
      - /valorant-platform-backend
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: chore(docker)
    # Digest and minor refreshes are the point of this config; a major jump is
    # not. Node's odd-numbered lines (25, 27) are Current releases that never
    # become LTS, and CI pins NODE_VERSION separately in ci.yml -- so taking a
    # major here would ship containers on a runtime nothing in CI tested, on a
    # line with no long-term security support. Bump the major deliberately
    # instead, when the next even line goes LTS, changing the Dockerfiles and
    # ci.yml together. Node 26 is the next one to move to.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
