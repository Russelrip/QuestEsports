name: CD

on:
  workflow_dispatch:
    inputs:
      repair_mobile_android_fingerprint:
        description: Set the verified Android release certificate fingerprint
        required: false
        default: false
        type: boolean
      repair_mobile_oauth_redirect:
        description: Set the production mobile OAuth App Link from API_PUBLIC_URL
        required: false
        default: false
        type: boolean
      repair_database_ssl:
        description: Add the required sslmode to production database URLs without printing credentials
        required: false
        default: false
        type: boolean
      repair_legacy_media:
        description: Restore missing packaged legacy poster files on the VPS
        required: false
        default: false
        type: boolean
      optimize_tournament_banners:
        description: Back up production, then optimize existing tournament banner files
        required: false
        default: false
        type: boolean
      optimize_event_album_photos:
        description: Back up production, then optimize existing event album photos
        required: false
        default: false
        type: boolean
      initialize_match_rooms:
        description: Back up production, then preview/backfill match rooms and apply scoped data hygiene
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  CI: true

jobs:
  backend-deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.BACKEND_DEPLOY_ENABLED == 'true' && github.actor == github.repository_owner }}
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/quest_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/quest_ci
      SESSION_COOKIE_NAME: quest_session
      DEPLOY_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Verify manual deployment commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          SUCCESSFUL_RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$DEPLOY_SHA" --status success --limit 1 --json databaseId --jq 'length')"
          test "$SUCCESSFUL_RUNS" = "1"

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run backend tests
        run: npm test

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SSH_PORT }}
          SSH_HOST_KEY: ${{ secrets.BACKEND_SSH_HOST_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_HOST_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/backend_deploy_key
          chmod 600 ~/.ssh/backend_deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend over SSH
        env:
          SSH_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SSH_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SSH_USER }}
          APP_DIR: ${{ secrets.BACKEND_APP_DIR }}
          PM2_PROCESS: ${{ secrets.BACKEND_PM2_PROCESS }}
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          MIGRATION_APPROVAL_SHA: ${{ secrets.BACKEND_MIGRATION_APPROVAL_SHA }}
          DESTRUCTIVE_MIGRATION_APPROVAL_SHA: ${{ secrets.BACKEND_DESTRUCTIVE_MIGRATION_APPROVAL_SHA }}
          MOBILE_ANDROID_CERT_SHA256: ${{ secrets.MOBILE_ADMIN_ANDROID_CERT_SHA256 }}
          REPAIR_LEGACY_MEDIA: ${{ inputs.repair_legacy_media }}
          OPTIMIZE_TOURNAMENT_BANNERS: ${{ inputs.optimize_tournament_banners }}
          OPTIMIZE_EVENT_ALBUM_PHOTOS: ${{ inputs.optimize_event_album_photos }}
          INITIALIZE_MATCH_ROOMS: ${{ inputs.initialize_match_rooms }}
          REPAIR_DATABASE_SSL: ${{ inputs.repair_database_ssl }}
          REPAIR_MOBILE_ANDROID_FINGERPRINT: ${{ inputs.repair_mobile_android_fingerprint }}
          REPAIR_MOBILE_OAUTH_REDIRECT: ${{ inputs.repair_mobile_oauth_redirect }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "DEPLOY_SHA must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [ -n "$MIGRATION_APPROVAL_SHA" ] && ! printf '%s' "$MIGRATION_APPROVAL_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "BACKEND_MIGRATION_APPROVAL_SHA must be empty or a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [ -n "$DESTRUCTIVE_MIGRATION_APPROVAL_SHA" ] && ! printf '%s' "$DESTRUCTIVE_MIGRATION_APPROVAL_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "BACKEND_DESTRUCTIVE_MIGRATION_APPROVAL_SHA must be empty or a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [ "$REPAIR_LEGACY_MEDIA" != "true" ] && [ "$REPAIR_LEGACY_MEDIA" != "false" ]; then
            echo "REPAIR_LEGACY_MEDIA must be true or false." >&2
            exit 1
          fi
          if [ "$OPTIMIZE_TOURNAMENT_BANNERS" != "true" ] && [ "$OPTIMIZE_TOURNAMENT_BANNERS" != "false" ]; then
            echo "OPTIMIZE_TOURNAMENT_BANNERS must be true or false." >&2
            exit 1
          fi
          if [ "$OPTIMIZE_EVENT_ALBUM_PHOTOS" != "true" ] && [ "$OPTIMIZE_EVENT_ALBUM_PHOTOS" != "false" ]; then
            echo "OPTIMIZE_EVENT_ALBUM_PHOTOS must be true or false." >&2
            exit 1
          fi
          if [ "$INITIALIZE_MATCH_ROOMS" != "true" ] && [ "$INITIALIZE_MATCH_ROOMS" != "false" ]; then
            echo "INITIALIZE_MATCH_ROOMS must be true or false." >&2
            exit 1
          fi
          if [ "$REPAIR_DATABASE_SSL" != "true" ] && [ "$REPAIR_DATABASE_SSL" != "false" ]; then
            echo "REPAIR_DATABASE_SSL must be true or false." >&2
            exit 1
          fi
          if [ "$REPAIR_MOBILE_OAUTH_REDIRECT" != "true" ] && [ "$REPAIR_MOBILE_OAUTH_REDIRECT" != "false" ]; then
            echo "REPAIR_MOBILE_OAUTH_REDIRECT must be true or false." >&2
            exit 1
          fi
          if [ "$REPAIR_MOBILE_ANDROID_FINGERPRINT" != "true" ] && [ "$REPAIR_MOBILE_ANDROID_FINGERPRINT" != "false" ]; then
            echo "REPAIR_MOBILE_ANDROID_FINGERPRINT must be true or false." >&2
            exit 1
          fi
          if [ "$REPAIR_MOBILE_ANDROID_FINGERPRINT" = "true" ] && ! printf '%s' "$MOBILE_ANDROID_CERT_SHA256" | grep -Eiq '^([0-9a-f]{2}:){31}[0-9a-f]{2}$'; then
            echo "MOBILE_ADMIN_ANDROID_CERT_SHA256 must contain the verified release certificate fingerprint." >&2
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/backend_deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' PM2_PROCESS='${PM2_PROCESS:-quest-backend}' HEALTHCHECK_URL='${HEALTHCHECK_URL:-http://127.0.0.1:5001/api/health}' MIGRATION_APPROVAL_SHA='$MIGRATION_APPROVAL_SHA' DESTRUCTIVE_MIGRATION_APPROVAL_SHA='$DESTRUCTIVE_MIGRATION_APPROVAL_SHA' MOBILE_ANDROID_CERT_SHA256='$MOBILE_ANDROID_CERT_SHA256' REPAIR_LEGACY_MEDIA='$REPAIR_LEGACY_MEDIA' OPTIMIZE_TOURNAMENT_BANNERS='$OPTIMIZE_TOURNAMENT_BANNERS' OPTIMIZE_EVENT_ALBUM_PHOTOS='$OPTIMIZE_EVENT_ALBUM_PHOTOS' INITIALIZE_MATCH_ROOMS='$INITIALIZE_MATCH_ROOMS' REPAIR_DATABASE_SSL='$REPAIR_DATABASE_SSL' REPAIR_MOBILE_ANDROID_FINGERPRINT='$REPAIR_MOBILE_ANDROID_FINGERPRINT' REPAIR_MOBILE_OAUTH_REDIRECT='$REPAIR_MOBILE_OAUTH_REDIRECT' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'SCRIPT'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            echo "Refusing to deploy as root. Configure the dedicated deploy user." >&2
            exit 1
          fi
          cd "$APP_DIR"
          test -f backend/.env
          ENV_MODE="$(stat -c '%a' backend/.env)"
          if [ "$ENV_MODE" != "600" ] && [ "$ENV_MODE" != "640" ]; then
            echo "backend/.env must have mode 600 or 640 (currently $ENV_MODE)." >&2
            exit 1
          fi
          DEPLOY_USER="$(id -un)"
          DEPLOY_GROUP="$(id -gn)"
          if [ -d backend/node_modules ]; then
            FOREIGN_NODE_MODULES_DIR="$(find backend/node_modules -type d ! -user "$DEPLOY_USER" -print -quit)"
            UNWRITABLE_NODE_MODULES_DIR="$(find backend/node_modules -type d ! -writable -print -quit)"
            if [ -n "$FOREIGN_NODE_MODULES_DIR" ] || [ -n "$UNWRITABLE_NODE_MODULES_DIR" ]; then
              PROBLEM_DIR="${UNWRITABLE_NODE_MODULES_DIR:-$FOREIGN_NODE_MODULES_DIR}"
              echo "The deploy user '$DEPLOY_USER' cannot safely replace backend/node_modules." >&2
              echo "Problem directory: $PROBLEM_DIR" >&2
              ls -ld "$PROBLEM_DIR" >&2 || true
              echo "Repair ownership on the VPS, then rerun this deployment:" >&2
              printf "  sudo chown -R %q:%q %q\n" "$DEPLOY_USER" "$DEPLOY_GROUP" "$APP_DIR/backend/node_modules" >&2
              exit 1
            fi
          fi
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_SHA_FILE="$APP_DIR/.quest-successful-deploy-sha"
          PREVIOUS_SHA="$CHECKOUT_SHA"
          if [ -f "$DEPLOYED_SHA_FILE" ]; then
            RECORDED_SHA="$(tr -d '[:space:]' < "$DEPLOYED_SHA_FILE")"
            if printf '%s' "$RECORDED_SHA" | grep -Eq '^[0-9a-f]{40}$' && git cat-file -e "$RECORDED_SHA^{commit}" 2>/dev/null; then
              PREVIOUS_SHA="$RECORDED_SHA"
            else
              echo "Ignoring invalid successful-deploy marker: $DEPLOYED_SHA_FILE" >&2
            fi
          fi
          REMOTE_URL="$(git remote get-url origin)"
          if ! git fetch --prune origin "$DEPLOY_SHA"; then
            echo "The VPS could not fetch origin: $REMOTE_URL" >&2
            echo "For a private GitHub repository, configure a read-only deploy key on the VPS and use the repository SSH URL." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "The VPS checkout has tracked changes. Refusing to overwrite them." >&2
            git status --short >&2
            exit 1
          fi

          MIGRATION_DIFF="$(git diff "$PREVIOUS_SHA" "$DEPLOY_SHA" -- 'backend/prisma/migrations/*/migration.sql')"
          MIGRATION_CHANGED=false
          DESTRUCTIVE_MIGRATION=false
          if [ -n "$MIGRATION_DIFF" ]; then
            MIGRATION_CHANGED=true
          fi
          if printf '%s\n' "$MIGRATION_DIFF" | grep -Eiq '^\+[^+].*(DROP[[:space:]]+(TABLE|COLUMN|INDEX|CONSTRAINT|TYPE)|ALTER[[:space:]]+COLUMN|RENAME[[:space:]]+(TO|COLUMN)|SET[[:space:]]+NOT[[:space:]]+NULL|TRUNCATE)'; then
            DESTRUCTIVE_MIGRATION=true
            echo "Deployment contains a destructive or backward-incompatible migration and requires separate approval." >&2
          fi

          HEALTHCHECK_ORIGIN="${HEALTHCHECK_URL%/api/health}"

          rollback() {
            EXIT_CODE="$1"
            FAILED_COMMAND="$2"
            trap - ERR EXIT
            set +e
            echo "Deployment command failed with exit code $EXIT_CODE: $FAILED_COMMAND" >&2
            echo "Restoring application code at $PREVIOUS_SHA." >&2
            if ! cd "$APP_DIR" || ! git checkout --detach "$PREVIOUS_SHA"; then
              echo "Rollback could not restore Git commit $PREVIOUS_SHA." >&2
              exit "$EXIT_CODE"
            fi
            if ! cd backend || ! npm ci; then
              echo "Rollback restored the previous code but could not restore its dependencies." >&2
              exit "$EXIT_CODE"
            fi
            if [ "$PROCESS_RESTART_ATTEMPTED" = true ]; then
              if ! pm2 restart "$PM2_PROCESS" --update-env; then
                echo "Rollback restored the previous code and dependencies but could not restart $PM2_PROCESS." >&2
                exit "$EXIT_CODE"
              fi
              HEALTHY=false
              for attempt in 1 2 3 4 5; do
                if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_ORIGIN/api/health/live" >/dev/null; then
                  HEALTHY=true
                  break
                fi
                sleep 2
              done
              if [ "$HEALTHY" != true ]; then
                echo "Rollback restarted $PM2_PROCESS, but its health check failed." >&2
              fi
            else
              echo "The running PM2 process was not changed; no process restart is required." >&2
            fi
            exit "$EXIT_CODE"
          }
          deployment_exit() {
            EXIT_CODE="$1"
            FAILED_COMMAND="$2"
            trap - EXIT
            if [ "$EXIT_CODE" -ne 0 ]; then
              rollback "$EXIT_CODE" "$FAILED_COMMAND"
            fi
          }
          PROCESS_RESTART_ATTEMPTED=false
          trap 'deployment_exit "$?" "$BASH_COMMAND"' EXIT

          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          if [ "$REPAIR_DATABASE_SSL" = "true" ]; then
            node ops/normalize-production-database-ssl.js backend/.env
          fi
          if [ "$REPAIR_MOBILE_OAUTH_REDIRECT" = "true" ]; then
            node ops/normalize-production-mobile-oauth.js backend/.env
          fi
          if [ "$REPAIR_MOBILE_ANDROID_FINGERPRINT" = "true" ]; then
            EXPECTED_MOBILE_ADMIN_ANDROID_CERT_SHA256="$MOBILE_ANDROID_CERT_SHA256" node ops/normalize-production-mobile-certificate.js backend/.env
          fi
          cd backend
          npm ci
          set +e
          npm run prisma:migrations:check-pending
          MIGRATION_STATUS_CODE="$?"
          set -e
          MIGRATION_PENDING=false
          if [ "$MIGRATION_STATUS_CODE" -eq 10 ]; then
            MIGRATION_PENDING=true
          elif [ "$MIGRATION_STATUS_CODE" -ne 0 ]; then
            echo "Could not determine whether production has pending database migrations." >&2
            exit "$MIGRATION_STATUS_CODE"
          fi
          if [ "$MIGRATION_CHANGED" = true ] || [ "$MIGRATION_PENDING" = true ]; then
            if [ "$MIGRATION_APPROVAL_SHA" != "$DEPLOY_SHA" ]; then
              echo "A schema migration requires BACKEND_MIGRATION_APPROVAL_SHA to equal $DEPLOY_SHA." >&2
              exit 1
            fi
            if [ "$DESTRUCTIVE_MIGRATION" = true ] && [ "$DESTRUCTIVE_MIGRATION_APPROVAL_SHA" != "$DEPLOY_SHA" ]; then
              echo "A destructive migration requires BACKEND_DESTRUCTIVE_MIGRATION_APPROVAL_SHA to equal $DEPLOY_SHA." >&2
              echo "Prefer an expand-and-contract release; use this approval only after a verified recovery backup and maintenance plan." >&2
              exit 1
            fi
          fi
          if [ "$MIGRATION_CHANGED" = true ] || [ "$MIGRATION_PENDING" = true ] || [ "$REPAIR_LEGACY_MEDIA" = "true" ] || [ "$OPTIMIZE_TOURNAMENT_BANNERS" = "true" ] || [ "$OPTIMIZE_EVENT_ALBUM_PHOTOS" = "true" ] || [ "$INITIALIZE_MATCH_ROOMS" = "true" ]; then
            BACKUP_ENV_FILE=/etc/quest-esports-backup.env bash "$APP_DIR/ops/backup-production.sh"
          fi
          npm run lint
          npm run prisma:migrate:deploy
          npm run prisma:security:verify
          if [ "$REPAIR_LEGACY_MEDIA" = "true" ]; then
            npm run media:import-legacy-posters
          fi
          if [ "$OPTIMIZE_TOURNAMENT_BANNERS" = "true" ]; then
            npm run media:optimize-tournament-banners
            npm run media:optimize-tournament-banners -- --apply
          fi
          if [ "$OPTIMIZE_EVENT_ALBUM_PHOTOS" = "true" ]; then
            npm run media:optimize-event-album-photos
            npm run media:optimize-event-album-photos -- --apply
          fi
          if [ "$INITIALIZE_MATCH_ROOMS" = "true" ]; then
            npm run data:backfill-match-rooms
            npm run data:backfill-match-rooms:apply
            npm run data:hygiene
            npm run data:hygiene:apply
          fi
          PROCESS_RESTART_ATTEMPTED=true
          pm2 restart "$PM2_PROCESS" --update-env
          HEALTHY=false
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_ORIGIN/api/health/live" >/dev/null; then
              HEALTHY=true
              break
            fi
            sleep 2
          done
          test "$HEALTHY" = true
          READINESS_HEADERS="$(curl --silent --show-error --max-time 10 --dump-header - --output /dev/null "$HEALTHCHECK_URL")"
          READINESS_STATUS="$(printf '%s\n' "$READINESS_HEADERS" | awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }')"
          if [ "$READINESS_STATUS" = 200 ]; then
            curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_ORIGIN/api/tournaments" >/dev/null
            curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_ORIGIN/api/products" >/dev/null
            curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_ORIGIN/api/commerce/capabilities" >/dev/null
          elif [ "$READINESS_STATUS" = 503 ] && printf '%s\n' "$READINESS_HEADERS" | grep -Eiq '^x-maintenance-mode:[[:space:]]*active[[:space:]]*$'; then
            echo "Backend deployed successfully while intentional site maintenance is active."
          else
            echo "Backend readiness check returned unexpected status $READINESS_STATUS." >&2
            exit 1
          fi
          pm2 save
          printf '%s\n' "$DEPLOY_SHA" > "$DEPLOYED_SHA_FILE"
          chmod 600 "$DEPLOYED_SHA_FILE"
          trap - EXIT
          SCRIPT
