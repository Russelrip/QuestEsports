name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      compose_run_id:
        description: Exact successful Compose workflow run to promote
        required: true
        type: string
  workflow_run:
    workflows:
      - Deploy immutable Compose release
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PRODUCTION_DEPLOYMENT_MODE == 'compose' && vars.FRONTEND_DEPLOY_ENABLED == 'true' && github.actor == github.repository_owner && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy immutable Compose release' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    environment: frontend-production
    timeout-minutes: 30
    env:
      COMPOSE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.compose_run_id }}
      COMPOSE_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Validate the exact Compose workflow run identity
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -euo pipefail
          [[ "$COMPOSE_RUN_ID" =~ ^[0-9]+$ ]]
          compose_workflow_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-compose.yml")"
          compose_workflow_id="$(jq -er '.id | tostring' <<< "$compose_workflow_json")"
          test "$(jq -er '.path' <<< "$compose_workflow_json")" = '.github/workflows/deploy-compose.yml'
          compose_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPOSE_RUN_ID")"
          test "$(jq -er '.id | tostring' <<< "$compose_run_json")" = "$COMPOSE_RUN_ID"
          compose_run_path="$(jq -er '.path' <<< "$compose_run_json")"
          test "${compose_run_path%@*}" = '.github/workflows/deploy-compose.yml'
          test "$(jq -er '.workflow_id | tostring' <<< "$compose_run_json")" = "$compose_workflow_id"
          test "$(jq -er '.name' <<< "$compose_run_json")" = 'Deploy immutable Compose release'
          test "$(jq -er '.conclusion' <<< "$compose_run_json")" = success
          compose_event="$(jq -er '.event' <<< "$compose_run_json")"
          [[ "$compose_event" == workflow_dispatch || "$compose_event" == workflow_run ]]
          test "$(jq -er '.head_branch' <<< "$compose_run_json")" = main
          resolved_compose_head_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$compose_run_json")"
          test "$(jq -er '.repository.full_name' <<< "$compose_run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.head_repository.full_name' <<< "$compose_run_json")" = "$GITHUB_REPOSITORY"
          compose_repository_id="$(jq -er '.repository.id | tostring' <<< "$compose_run_json")"
          compose_head_repository_id="$(jq -er '.head_repository.id | tostring' <<< "$compose_run_json")"
          compose_artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPOSE_RUN_ID/artifacts?per_page=100")"
          for expected_artifact in compose-release-success frontend-release frontend-release-mode; do
            artifact_json="$(jq -er --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name) | if .expired == false then . else empty end] | if length == 1 then .[0] else error("expected one active artifact") end' <<< "$compose_artifacts_json")"
            [[ "$(jq -er '.id | tostring' <<< "$artifact_json")" =~ ^[0-9]+$ ]]
            test "$(jq -er '.name' <<< "$artifact_json")" = "$expected_artifact"
            test "$(jq -er '.expired' <<< "$artifact_json")" = false
            test "$(jq -er '.workflow_run.id | tostring' <<< "$artifact_json")" = "$COMPOSE_RUN_ID"
            test "$(jq -er '.workflow_run.repository_id | tostring' <<< "$artifact_json")" = "$compose_repository_id"
            test "$(jq -er '.workflow_run.head_repository_id | tostring' <<< "$artifact_json")" = "$compose_head_repository_id"
            test "$(jq -er '.workflow_run.head_branch' <<< "$artifact_json")" = main
            test "$(jq -er '.workflow_run.head_sha' <<< "$artifact_json")" = "$resolved_compose_head_sha"
          done
          printf 'COMPOSE_EVENT=%s\n' "$compose_event" >> "$GITHUB_ENV"
          printf 'COMPOSE_RELEASE_HEAD_SHA=%s\n' "$resolved_compose_head_sha" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ "$compose_event" == workflow_run || "$compose_event" == workflow_dispatch ]]
            if [[ "$compose_event" == workflow_run ]]; then
              test "$COMPOSE_HEAD_SHA" = "$resolved_compose_head_sha"
            fi
          fi

      - name: Download the exact successful Compose deployment proof
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compose-release-success
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: compose-release-proof

      - name: Download the manually selected Compose deployment proof
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compose-release-success
          run-id: ${{ inputs.compose_run_id }}
          github-token: ${{ github.token }}
          path: compose-release-proof

      - name: Download the exact frontend release lineage
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: frontend-release

      - name: Download the manually selected frontend release lineage
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-release
          run-id: ${{ inputs.compose_run_id }}
          github-token: ${{ github.token }}
          path: frontend-release

      - name: Download the exact frontend release mode
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-release-mode
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: frontend-release-mode

      - name: Download the manually selected frontend release mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-release-mode
          run-id: ${{ inputs.compose_run_id }}
          github-token: ${{ github.token }}
          path: frontend-release-mode

      - name: Validate the actual Compose deploy job proof
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          proof='compose-release-proof/release-success.txt'
          test -f "$proof" && test ! -L "$proof"
          test "$(find compose-release-proof -type f -print | wc -l)" -eq 1
          expected_keys='compose_workflow deploy_job release_sha'
          actual_keys="$(awk -F= '{ print $1 }' "$proof" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          test "$actual_keys" = "$expected_keys"
          while IFS= read -r line; do
            [[ "$line" =~ ^[a-z][a-z0-9_]*=[^[:space:]]+$ ]]
          done < "$proof"
          test "$(awk -F= '$1 == "compose_workflow" { print substr($0, index($0, "=") + 1) }' "$proof")" = Deploy_immutable_Compose_release
          test "$(awk -F= '$1 == "deploy_job" { print substr($0, index($0, "=") + 1) }' "$proof")" = deploy
          proof_sha="$(awk -F= '$1 == "release_sha" { print $2 }' "$proof")"
          [[ "$proof_sha" =~ ^[0-9a-f]{40}$ ]]
          release_lineage_file='frontend-release/release-lineage.txt'
          test -f "$release_lineage_file" && test ! -L "$release_lineage_file"
          test "$(find frontend-release -type f -print | wc -l)" -eq 1
          expected_lineage_keys='release_sha ci_run_id'
          actual_lineage_keys="$(awk -F= '{ print $1 }' "$release_lineage_file" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          test "$actual_lineage_keys" = "$expected_lineage_keys"
          while IFS= read -r line; do
            [[ "$line" =~ ^[a-z][a-z0-9_]*=[^[:space:]]+$ ]]
          done < "$release_lineage_file"
          release_sha="$(awk -F= '$1 == "release_sha" { print $2 }' "$release_lineage_file")"
          ci_run_id="$(awk -F= '$1 == "ci_run_id" { print $2 }' "$release_lineage_file")"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ci_run_id" =~ ^[0-9]+$ ]]
          test "$proof_sha" = "$release_sha"
          release_mode_file='frontend-release-mode/release-mode.txt'
          test -f "$release_mode_file" && test ! -L "$release_mode_file"
          test "$(find frontend-release-mode -type f -print | wc -l)" -eq 1
          release_mode="$(awk -F= '$1 == "release_mode" { print $2 }' "$release_mode_file")"
          [[ "$release_mode" == normal || "$release_mode" == adoption || "$release_mode" == rollback ]]
          if [[ "$release_mode" == rollback && "$COMPOSE_EVENT" != workflow_dispatch ]]; then
            echo 'A rollback release must be produced by an explicit Compose dispatch.' >&2
            exit 1
          fi
          if [[ "$COMPOSE_EVENT" == workflow_run ]]; then
            test "$COMPOSE_RELEASE_HEAD_SHA" = "$release_sha"
          fi
          printf 'DEPLOY_SHA=%s\n' "$release_sha" >> "$GITHUB_ENV"
          printf 'CI_RUN_ID=%s\n' "$ci_run_id" >> "$GITHUB_ENV"

      - name: Validate approved commit and backend compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_API_URL"
          printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          release_mode="$(awk -F= '$1 == "release_mode" { print $2 }' frontend-release-mode/release-mode.txt)"
          [[ "$release_mode" == normal || "$release_mode" == rollback ]]
          resolved_ci_run_id="$CI_RUN_ID"
          ci_workflow_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml")"
          ci_workflow_id="$(jq -er '.id | tostring' <<< "$ci_workflow_json")"
          test "$(jq -er '.path' <<< "$ci_workflow_json")" = '.github/workflows/ci.yml'
          [[ "$resolved_ci_run_id" =~ ^[0-9]+$ ]]
          ci_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$resolved_ci_run_id")"
          test "$(jq -er '.id | tostring' <<< "$ci_run_json")" = "$resolved_ci_run_id"
          ci_run_path="$(jq -er '.path' <<< "$ci_run_json")"
          test "${ci_run_path%@*}" = '.github/workflows/ci.yml'
          test "$(jq -er '.workflow_id | tostring' <<< "$ci_run_json")" = "$ci_workflow_id"
          test "$(jq -er '.name' <<< "$ci_run_json")" = CI
          test "$(jq -er '.conclusion' <<< "$ci_run_json")" = success
          test "$(jq -er '.event' <<< "$ci_run_json")" = push
          test "$(jq -er '.head_branch' <<< "$ci_run_json")" = main
          test "$(jq -er '.repository.full_name' <<< "$ci_run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.head_repository.full_name' <<< "$ci_run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$ci_run_json")" = "$DEPLOY_SHA"
          CAPABILITIES="$(curl --fail --silent --show-error --max-time 10 -H "Origin: https://questesports.lk" "$PRODUCTION_API_URL/api/capabilities")"
          test "$(printf '%s' "$CAPABILITIES" | jq -r '.apiCompatibilityVersion')" -ge 2

      - name: Check out approved source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm test

      - name: Build exact Vercel artifact
        working-directory: .
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL }}
          NEXT_PUBLIC_SITE_URL: https://questesports.lk
        run: |
          npx --yes vercel@54.17.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@54.17.3 build --prod --token="$VERCEL_TOKEN"

      - name: Promote tested artifact
        working-directory: .
        run: npx --yes vercel@54.17.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
