name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full main-branch commit SHA to deploy
        required: true
        type: string
  workflow_run:
    workflows:
      - CD
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.FRONTEND_DEPLOY_ENABLED == 'true' && github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.name == 'CD' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: frontend-production
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.deploy_sha }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Validate approved commit and backend compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          test -n "$PRODUCTION_API_URL"
          printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$DEPLOY_SHA"
          SUCCESSFUL_RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$DEPLOY_SHA" --status success --limit 1 --json databaseId --jq 'length')"
          test "$SUCCESSFUL_RUNS" = "1"
          CAPABILITIES="$(curl --fail --silent --show-error --max-time 10 -H "Origin: https://questesports.lk" "$PRODUCTION_API_URL/api/capabilities")"
          test "$(printf '%s' "$CAPABILITIES" | jq -r '.apiCompatibilityVersion')" -ge 2

      - name: Check out approved source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm test

      - name: Build exact Vercel artifact
        working-directory: .
        run: |
          npx --yes vercel@58.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@58.9.0 build --prod --token="$VERCEL_TOKEN"

      - name: Promote tested artifact
        working-directory: .
        run: npx --yes vercel@58.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
