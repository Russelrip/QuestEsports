name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  CI: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: quest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d quest_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/quest_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/quest_ci?schema=public
      SESSION_COOKIE_NAME: quest_session
      RUN_DATABASE_INTEGRATION_TESTS: true
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Verify no Prisma migrations are pending
        run: npm run prisma:migrate:status

      - name: Verify applied migrations match Prisma schema
        run: >-
          npx prisma migrate diff
          --exit-code
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma

      - name: Verify database RLS and Data API privileges
        run: npm run prisma:security:verify

      - name: Run backend tests with coverage thresholds
        run: npm run test:coverage

      - name: Run backend lint
        run: npm run lint

  frontend:
    name: Frontend audit, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ALLOW_INSECURE_LOOPBACK_URLS: true
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5011
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PLAYWRIGHT_MOCK_API_PORT: 5011

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend type-check
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run frontend E2E tests
        run: npm run test:e2e

  mobile-admin:
    name: Mobile admin validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-admin
    env:
      EXPO_PUBLIC_API_URL: https://api.questesports.lk
      EXPO_PUBLIC_SITE_URL: https://questesports.lk

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-admin/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Audit mobile dependencies
        run: npm audit --audit-level=high

      - name: Run mobile tests
        run: npm test

      - name: Run mobile type-check
        run: npm run typecheck

      - name: Validate Expo dependencies and configuration
        run: npm run doctor
