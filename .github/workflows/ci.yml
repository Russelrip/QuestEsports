name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  CI: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: quest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d quest_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/quest_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/quest_ci?schema=public
      SESSION_COOKIE_NAME: quest_session
      RUN_DATABASE_INTEGRATION_TESTS: true
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Verify no Prisma migrations are pending
        run: npm run prisma:migrate:status

      - name: Verify applied migrations match Prisma schema
        run: >-
          npx prisma migrate diff
          --exit-code
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma

      - name: Verify Prisma never references the valorant schema
        run: node scripts/verify-prisma-schema-scope.js

      - name: Verify database RLS and Data API privileges
        run: npm run prisma:security:verify

      - name: Run backend tests with coverage thresholds
        run: npm run test:coverage

      - name: Run backend lint
        run: npm run lint

  postgres17-contracts:
    name: PostgreSQL 17 production contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate PostgreSQL 17 contracts statically
        shell: bash
        run: |
          set -euo pipefail
          compose='ops/docker/compose.production.yml'
          staging='ops/docker/compose.postgres-staging.yml'
          bootstrap='ops/docker/postgres/init/001-bootstrap-roles.sql'
          backup='ops/quest-esports-backup.env.example'
          rehearsal='ops/rehearsal/postgres17-restore-rehearsal.sh'

          # The disposable backend fixture remains PostgreSQL 16. The
          # production PostgreSQL 17 contract is checked separately below.
          test "$(grep -Fc 'image: postgres:16' .github/workflows/ci.yml)" -eq 1
          ! grep -Eq 'image:[[:space:]]*postgres:17' .github/workflows/ci.yml

          grep -F 'postgres:17-bookworm@sha256:' "$compose" >/dev/null
          grep -F 'POSTGRES_IMAGE must be supplied by the release manifest' "$compose" >/dev/null
          grep -F '127.0.0.1:${POSTGRES_STAGING_HOST_PORT:-55432}:5432' "$staging" >/dev/null
          ! awk '
            /^  postgres:/ { in_postgres=1; next }
            in_postgres && /^  [A-Za-z0-9_-]+:/ { exit }
            in_postgres && /^[[:space:]]+ports:/ { bad=1 }
            END { exit bad+0 }
          ' "$compose"

          for role in quest_migrator quest_runtime val_migrator val_runtime; do
            grep -Fx "ALTER ROLE $role LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" "$bootstrap" >/dev/null
          done
          grep -F 'GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO quest_runtime;' "$bootstrap" >/dev/null
          grep -F 'GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO val_runtime;' "$bootstrap" >/dev/null
          grep -F 'ALTER DEFAULT PRIVILEGES FOR ROLE quest_migrator REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC;' "$bootstrap" >/dev/null
          grep -F 'ALTER DEFAULT PRIVILEGES FOR ROLE val_migrator REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC;' "$bootstrap" >/dev/null

          for setting in \
            'POSTGRES_TARGET_HOST=127.0.0.1' \
            'POSTGRES_TARGET_PORT=55432' \
            'POSTGRES_TARGET_DATABASE=quest' \
            'POSTGRES_TARGET_MAJOR=17' \
            'POSTGRES_TARGET_DATA_ROOT=/srv/quest-esports/postgres/17/data'; do
            grep -Fx "$setting" "$backup" >/dev/null
          done
          grep -F 'POSTGRES17_BIN' ops/backup-production-multi-remote.sh >/dev/null
          grep -F 'quest_backup' ops/backup-production-multi-remote.sh >/dev/null
          grep -F -- '--no-acl' ops/restore-production-backup.sh >/dev/null
          grep -F 'DISPOSABLE_QUEST_REHEARSAL' "$rehearsal" >/dev/null
          grep -F 'disposable_postgresql17' "$rehearsal" >/dev/null
          grep -F 'POSTGRES17_BIN' "$rehearsal" >/dev/null
          grep -F 'owner_deployment_host_evidence_required' ops/rehearsal/rehearsal-contract.sh >/dev/null

          # Keep the operator contract visible and prevent a future document
          # edit from reintroducing Supabase/VPS ambiguity.
          grep -F 'PostgreSQL 17 VPS target' docs/production-runbook.md >/dev/null
          grep -F 'temporary Supabase rollback material' docs/production-runbook.md >/dev/null
          grep -F 'PostgreSQL 16.15 cluster remains untouched' docs/production-runbook.md >/dev/null
          grep -F '127.0.0.1:55432' docs/production-runbook.md >/dev/null
          grep -F 'no public database port' docs/production-runbook.md >/dev/null
          grep -F 'Post-first-write rollback boundary' docs/backup-and-disaster-recovery.md >/dev/null
          grep -F 'supabase_url_rollback=prohibited' docs/backup-and-disaster-recovery.md >/dev/null

          compose_env="$RUNNER_TEMP/quest-compose-contract.env"
          base_render="$RUNNER_TEMP/quest-compose-base.json"
          staging_render="$RUNNER_TEMP/quest-compose-staging.json"
          printf '%s\n' \
            'QUEST_FRONTEND_IMAGE=ghcr.io/russelrip/quest-frontend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            'QUEST_BACKEND_IMAGE=ghcr.io/russelrip/quest-backend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
            'POSTGRES_IMAGE=postgres:17-bookworm@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc' \
            'VALORANT_IMAGE=ghcr.io/example/valorant@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd' \
            'POSTGRES_STAGING_HOST_PORT=55432' > "$compose_env"
          sudo install -d -m 0755 /etc/quest-esports
          sudo install -m 0644 /dev/null /etc/quest-esports/quest.production.env
          docker compose --env-file "$compose_env" -f "$compose" config --format json > "$base_render"
          docker compose --env-file "$compose_env" -f "$compose" -f "$staging" config --format json > "$staging_render"
          python - "$base_render" "$staging_render" <<'PY'
          import json
          import sys

          base = json.load(open(sys.argv[1]))
          staging = json.load(open(sys.argv[2]))
          base_ports = base["services"]["postgres"].get("ports", [])
          assert base_ports == [], f"base PostgreSQL host publication: {base_ports!r}"
          staging_ports = staging["services"]["postgres"].get("ports", [])
          assert len(staging_ports) == 1, f"staging PostgreSQL publication count: {staging_ports!r}"
          port = staging_ports[0]
          assert port.get("host_ip") == "127.0.0.1", port
          assert str(port.get("published")) == "55432", port
          assert str(port.get("target")) == "5432", port
          print("Compose renders verified: base PostgreSQL ports=[]; staging PostgreSQL ports=127.0.0.1:55432->5432")
          PY

          bash -n \
            ops/backup-production.sh \
            ops/backup-production-multi-remote.sh \
            ops/restore-production-backup.sh \
            ops/rehearsal/postgres17-restore-rehearsal.sh

      - name: Run PostgreSQL 17 disposable contract suites
        shell: bash
        run: |
          set -euo pipefail
          bash ops/tests/media-backup-contract.test.sh
          bash ops/tests/restore-production-backup.test.sh
          bash ops/tests/postgres17-rehearsal.test.sh

  frontend:
    name: Frontend audit, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: frontend
    env:
      HOME: /root
      ALLOW_INSECURE_LOOPBACK_URLS: true
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5011
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PLAYWRIGHT_MOCK_API_PORT: 5011

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend type-check
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run frontend E2E tests
        env:
          INTERNAL_API_URL: http://127.0.0.1:5011
        run: npm run test:e2e

  mobile-admin:
    name: Mobile admin validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-admin
    env:
      EXPO_PUBLIC_API_URL: https://api.questesports.lk
      EXPO_PUBLIC_SITE_URL: https://questesports.lk

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-admin/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Audit mobile dependencies
        run: npm run audit:ci

      - name: Run mobile tests
        run: npm test

      - name: Run mobile type-check
        run: npm run typecheck

      - name: Validate Expo dependencies and configuration
        run: npm run doctor

  valorant-e2e:
    name: VALORANT two-service E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALORANT_PLATFORM_ACCESS_TOKEN: ${{ secrets.VALORANT_PLATFORM_ACCESS_TOKEN }}
    steps:
      - name: Skip VALORANT E2E when platform token is unset
        if: ${{ env.VALORANT_PLATFORM_ACCESS_TOKEN == '' }}
        run: echo "VALORANT_PLATFORM_ACCESS_TOKEN not set; skipping VALORANT two-service E2E."
      - name: Check out repository
        if: ${{ env.VALORANT_PLATFORM_ACCESS_TOKEN != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Check out valorant-platform-backend
        if: ${{ env.VALORANT_PLATFORM_ACCESS_TOKEN != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: naheedroomy/valorant-platform-backend
          token: ${{ secrets.VALORANT_PLATFORM_ACCESS_TOKEN }}
          path: valorant-platform-backend
      - name: Set up Node.js
        if: ${{ env.VALORANT_PLATFORM_ACCESS_TOKEN != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Set up uv
        if: ${{ env.VALORANT_PLATFORM_ACCESS_TOKEN != '' }}
        uses: astral-sh/setup-uv@v3
      - name: Prepare FastAPI deps and env
        if: ${{ env.VALORANT_PLATFORM_ACCESS_TOKEN != '' }}
        working-directory: valorant-platform-backend
        run: uv sync --extra dev
      - name: Run two-service E2E
        if: ${{ env.VALORANT_PLATFORM_ACCESS_TOKEN != '' }}
        working-directory: backend
        run: >-
          VALORANT_PLATFORM_REPO=$GITHUB_WORKSPACE/valorant-platform-backend
          E2E_VAL_DATABASE_URL=${{ secrets.E2E_VAL_DATABASE_URL }}
          E2E_QUEST_DATABASE_URL=${{ secrets.E2E_QUEST_DATABASE_URL }}
          E2E_ADMIN_EMAIL=${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD=${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SAVED_TEAM_A_ID=${{ secrets.E2E_SAVED_TEAM_A_ID }}
          E2E_SAVED_TEAM_B_ID=${{ secrets.E2E_SAVED_TEAM_B_ID }}
          E2E_PLAYER_A='${{ secrets.E2E_PLAYER_A }}'
          E2E_PLAYER_B='${{ secrets.E2E_PLAYER_B }}'
          E2E_MATCH_HENRIK_ID=${{ secrets.E2E_MATCH_HENRIK_ID }}
          E2E_MATCH_UUIDS=${{ secrets.E2E_MATCH_UUIDS }}
          E2E_ANCHOR_MISMATCH_SERIES=${{ secrets.E2E_ANCHOR_MISMATCH_SERIES }}
          npm run test:valorant:e2e
