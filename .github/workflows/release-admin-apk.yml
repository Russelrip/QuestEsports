name: Release Quest Admin APK

on:
  push:
    tags:
      - "admin-v*.*.*"

permissions:
  actions: read
  contents: write

concurrency:
  group: admin-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile-admin
    env:
      EXPO_PUBLIC_API_URL: https://api.questesports.lk
      EXPO_PUBLIC_SITE_URL: https://questesports.lk
      EXPO_PUBLIC_OAUTH_REDIRECT_URL: https://api.questesports.lk/mobile-admin-oauth

    steps:
      - name: Check out release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Verify tag is the tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          git fetch --no-tags origin main
          RELEASE_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          SUCCESSFUL_RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$RELEASE_SHA" --status success --limit 1 --json databaseId --jq 'length')"
          test "$SUCCESSFUL_RUNS" = "1"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-admin/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:ci

      - name: Validate application
        run: |
          npm run typecheck
          npm test
          npm run doctor

      - name: Set Android release version
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME}" "${GITHUB_RUN_NUMBER}"

      - name: Generate Android project
        env:
          CI: "1"
        run: npm run prebuild:android

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          QUEST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QUEST_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QUEST_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$QUEST_ANDROID_KEYSTORE_PASSWORD"
          test -n "$QUEST_ANDROID_KEY_ALIAS"
          test -n "$QUEST_ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          echo "QUEST_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/mobile-admin/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: mobile-admin/android
        env:
          QUEST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QUEST_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QUEST_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare release files
        run: |
          version="${GITHUB_REF_NAME#admin-v}"
          apk_name="quest-admin-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Publish private repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK_NAME" \
            "${APK_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quest Admin ${GITHUB_REF_NAME#admin-v}" \
            --generate-notes \
            --verify-tag
