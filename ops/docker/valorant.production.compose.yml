name: valorant-prod

services:
  valorant-platform:
    image: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
    env_file:
      - path: /etc/quest-esports/valorant.production.env
        required: true
    ports:
      - "127.0.0.1:8000:8000"
    entrypoint: [/app/.venv/bin/python, -m, scripts.validate_release_image]
    command:
      - /app/.venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ssl-certfile
      - /run/valorant-tls/valorant-platform.crt
      - --ssl-keyfile
      - /run/valorant-tls/valorant-platform.key
    environment:
      APP_ENV: production
      VALORANT_PLATFORM_IMAGE: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
      VALORANT_DATABASE_SSL_VERIFY: full
      VALORANT_DATABASE_SSL_CA_FILE: /run/secrets/quest-private-ca.crt
      VALORANT_DATABASE_SSL_SERVER_HOSTNAME: quest-postgres
    volumes:
      - type: bind
        source: ${VALORANT_TLS_CERT_FILE:-/etc/quest-esports/tls/valorant-platform.crt}
        target: /run/valorant-tls/valorant-platform.crt
        read_only: true
      - type: bind
        source: ${VALORANT_TLS_KEY_FILE:-/etc/quest-esports/tls/valorant-platform.key}
        target: /run/valorant-tls/valorant-platform.key
        read_only: true
      - /etc/quest-esports/tls/quest-private-ca.crt:/run/secrets/quest-private-ca.crt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for token in $(/app/.venv/bin/python -c 'from app.api.service_token import parse_secrets_map, sign_service_token; from app.config import Settings; s=Settings(); [print(sign_service_token(secret=secret, kid=kid, issuer=s.quest_service_issuer, audience=s.quest_service_audience, subject="quest-health")) for kid, secret in parse_secrets_map(s.quest_service_shared_secrets).items()]'); do
            curl --fail --silent --show-error --max-time 5
            --cacert /run/secrets/quest-private-ca.crt
            --resolve valorant-platform:8000:127.0.0.1
            -H "Authorization: Bearer $token"
            https://valorant-platform:8000/api/v1/health
            | /app/.venv/bin/python -c 'import json,sys; d=json.load(sys.stdin); c=d.get("checks", {}); required={"service_token", "henrik", "discord_oauth", "oauth_redirect", "discord_workers", "tls"}; raise SystemExit(0 if d.get("status") == "ok" and d.get("db") == "up" and d.get("integration") == "ready" and set(c) == required and all(v == "ready" for v in c.values()) else 1)';
            if [ "$?" -eq 0 ]; then exit 0; fi
          done;
          exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      quest-shared:
        aliases:
          - valorant-platform
          - valorant-updater
          - valorant-discord-bot
          - valorant-name-audit
    restart: unless-stopped

  valorant-updater:
    image: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
    env_file:
      - path: /etc/quest-esports/valorant.production.env
        required: true
    entrypoint: [/app/.venv/bin/python, -m, scripts.validate_release_image]
    command: [/app/.venv/bin/python, -m, workers.updater]
    environment:
      APP_ENV: production
      VALORANT_PLATFORM_IMAGE: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
      VALORANT_DATABASE_SSL_VERIFY: full
      VALORANT_DATABASE_SSL_CA_FILE: /run/secrets/quest-private-ca.crt
      VALORANT_DATABASE_SSL_SERVER_HOSTNAME: quest-postgres
    volumes:
      - /etc/quest-esports/tls/quest-private-ca.crt:/run/secrets/quest-private-ca.crt:ro
    networks:
      quest-shared: {}
    # Admission denial exits 0, so validation mode does not spin a writer in a
    # restart loop; unexpected failures still restart the long-running worker.
    restart: on-failure

  valorant-discord-bot:
    image: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
    env_file:
      - path: /etc/quest-esports/valorant.production.env
        required: true
    entrypoint: [/app/.venv/bin/python, -m, scripts.validate_release_image]
    command: [/app/.venv/bin/python, -m, workers.discord_bot]
    environment:
      APP_ENV: production
      VALORANT_PLATFORM_IMAGE: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
      VALORANT_DATABASE_SSL_VERIFY: full
      VALORANT_DATABASE_SSL_CA_FILE: /run/secrets/quest-private-ca.crt
      VALORANT_DATABASE_SSL_SERVER_HOSTNAME: quest-postgres
    volumes:
      - /etc/quest-esports/tls/quest-private-ca.crt:/run/secrets/quest-private-ca.crt:ro
    networks:
      quest-shared: {}
    # Admission denial exits 0, so validation mode does not spin a writer in a
    # restart loop; unexpected failures still restart the long-running worker.
    restart: on-failure

  valorant-name-audit:
    image: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
    env_file:
      - path: /etc/quest-esports/valorant.production.env
        required: true
    entrypoint: [/app/.venv/bin/python, -m, scripts.validate_release_image]
    command: [/app/.venv/bin/python, -m, workers.name_audit]
    environment:
      APP_ENV: production
      VALORANT_PLATFORM_IMAGE: ${VALORANT_IMAGE:?VALORANT_IMAGE must be supplied by the release manifest}
      VALORANT_DATABASE_SSL_VERIFY: full
      VALORANT_DATABASE_SSL_CA_FILE: /run/secrets/quest-private-ca.crt
      VALORANT_DATABASE_SSL_SERVER_HOSTNAME: quest-postgres
      RELEASE_LOCK_PATH: /var/lock/quest-esports-release.lock
    volumes:
      - /etc/quest-esports/tls/quest-private-ca.crt:/run/secrets/quest-private-ca.crt:ro
      - type: bind
        source: ${QUEST_RELEASE_LOCK_FILE:-/var/lock/quest-esports-release.lock}
        target: /var/lock/quest-esports-release.lock
    networks:
      quest-shared: {}
    restart: "no"

networks:
  quest-shared:
    name: quest-shared
    external: true
