# Host Nginx is the only public application ingress. The Compose publications
# remain loopback-only; upload roots are never exposed by this file.
#
# This file mirrors the deployed vhosts. Keep it that way: it is the contract
# for what the host serves, so a divergence here is a divergence nobody sees
# until the config is reinstalled.
#
# Dependency: the VALORANT blocks include /etc/nginx/cloudflare-real-ip.conf,
# which is generated on the host from https://www.cloudflare.com/ips-v4 and
# /ips-v6 as `set_real_ip_from <range>;` lines plus `real_ip_header
# CF-Connecting-IP;`. Regenerate it when Cloudflare publishes new ranges.

server {
    listen 80;
    server_name questesports.lk www.questesports.lk;

    # Certificate renewal is HTTP-01, so this must be served by the host and
    # never proxied to the application.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name questesports.lk www.questesports.lk;

    ssl_certificate /etc/letsencrypt/live/questesports.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/questesports.lk/privkey.pem;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

server {
    listen 80;
    server_name api.questesports.lk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.questesports.lk;

    ssl_certificate /etc/letsencrypt/live/api.questesports.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.questesports.lk/privkey.pem;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The realtime stream sets X-Accel-Buffering: no per response and
        # heartbeats every 25s. These make the vhost safe for SSE on its own,
        # independently of what any single response asks for.
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# api.valorantsl.com is published through Cloudflare.
#
# Port 80 is deliberately NOT redirected to 443. While Cloudflare is in
# Flexible mode it connects to this origin over port 80, and a redirect there
# returns the request to Cloudflare, which forwards it to port 80 again --
# an infinite loop that takes the API down.
#
# After Cloudflare SSL/TLS is set to Full (strict), and not before, replace
# this server block's `location /` with:
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
server {
    listen 80;
    server_name api.valorantsl.com;

    client_max_body_size 25m;
    include /etc/nginx/cloudflare-real-ip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass https://127.0.0.1:8000;
        proxy_ssl_trusted_certificate /etc/quest-esports/tls/quest-private-ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name valorant-platform;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name api.valorantsl.com;

    ssl_certificate /etc/letsencrypt/live/api.valorantsl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valorantsl.com/privkey.pem;

    client_max_body_size 25m;

    # The origin sits behind Cloudflare, so $remote_addr is a Cloudflare edge
    # address. Restore the client address from CF-Connecting-IP, trusting only
    # Cloudflare's published ranges.
    include /etc/nginx/cloudflare-real-ip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        # The VALORANT container terminates its own TLS with the Quest private
        # CA, so the origin hop stays encrypted end to end. Verification is not
        # optional: without it this hop would accept any certificate and the
        # encryption would prove nothing about who answered.
        proxy_pass https://127.0.0.1:8000;
        proxy_ssl_trusted_certificate /etc/quest-esports/tls/quest-private-ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name valorant-platform;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
