# Host Nginx is the only public application ingress. The Compose publications
# remain loopback-only; upload roots are never exposed by this file.
#
# api.valorantsl.com is published through Cloudflare, so its origin TLS and the
# Cloudflare SSL/TLS mode must be changed together. Install the 443 server block
# first, switch Cloudflare to Full (strict), and only then enable the 80 -> 443
# redirect below. Enabling the redirect while Cloudflare is still in Flexible
# mode produces an infinite redirect loop.

server {
    listen 80;
    server_name questesports.lk www.questesports.lk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name questesports.lk www.questesports.lk;
    ssl_certificate /etc/letsencrypt/live/questesports.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/questesports.lk/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.questesports.lk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.questesports.lk;
    ssl_certificate /etc/letsencrypt/live/api.questesports.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.questesports.lk/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

server {
    listen 80;
    server_name api.valorantsl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.valorantsl.com;
    ssl_certificate /etc/letsencrypt/live/api.valorantsl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valorantsl.com/privkey.pem;

    # The origin sits behind Cloudflare, so $remote_addr is a Cloudflare edge
    # address. Restore the client address from CF-Connecting-IP, trusting only
    # Cloudflare's published ranges.
    include /etc/nginx/cloudflare-real-ip.conf;

    location / {
        # The VALORANT container terminates its own TLS with the Quest private
        # CA, so the origin hop stays encrypted end to end.
        proxy_pass https://127.0.0.1:8000;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
