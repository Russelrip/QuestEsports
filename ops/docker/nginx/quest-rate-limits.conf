# Mirrors /etc/nginx/conf.d/quest-rate-limits.conf on the host.
#
# The zones live here rather than in quest.conf because nginx accepts a shared
# memory zone declared twice only while the name, size and key all match: edit
# one copy and the next `nginx -s reload` aborts with "the size ... conflicts
# with already declared size". One declaration, one file.
#
# Both zones are keyed by client address and apply to api.questesports.lk; the
# site's own server-side rendering reaches the backend over the Docker network
# rather than through nginx, so only outside callers ever meet them. The
# `limit_req` directives that use them are in quest.conf.
limit_req_zone $binary_remote_addr zone=quest_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=quest_public_lists:10m rate=20r/m;
