[project]
name = "valorant-platform-backend"
version = "0.1.0"
description = "VALORANT stats aggregation platform backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "discord-py>=2.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.4"]

[tool.uv]
package = false

# uv-native dev group (installed by default by `uv run`), kept in sync with
# the `dev` optional extra above so both the documented `pip install -e .[dev]`
# extra and the brief's `uv run pytest` / `uv run ruff` commands work.
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in tests that hit the live Henrik API"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Verbatim legacy artifact (byte-for-byte copy of valorant-lk-elo's
# elo_calculator.py) — legacy-era typing idioms trip modern lints; the copy
# must stay unmodified until the post-parity naming-normalization pass
# (see ADR-023).
per-file-ignores = { "app/legacy/elo_calculator.py" = ["I001", "UP006", "UP035", "RUF013"] }
