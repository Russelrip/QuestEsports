name: CD

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.sha }}
  CANONICAL_CHECKOUT_PATH: /opt/quest-esports/valorant-platform-backend
  COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_CERTIFICATE_IDENTITY: https://github.com/Russelrip/valorant-platform-backend/.github/workflows/cd.yml@refs/heads/main

jobs:
  deploy:
    name: Deploy platform backend
    runs-on: ubuntu-latest
    environment: production
    # Quest's adoption controller is the production deployment authority. This
    # legacy path is fail-closed unless explicitly re-enabled for rollback.
    if: ${{ github.actor == github.repository_owner && vars.LEGACY_DIRECT_CD_ENABLED == 'true' }}
    steps:
      - name: Verify CI passed for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESSFUL_RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$DEPLOY_SHA" --status success --limit 1 --json databaseId --jq 'length')"
          test "$SUCCESSFUL_RUNS" = "1"

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set immutable image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish immutable production image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: true

      - name: Verify image digest is available
        run: test -n "${{ steps.image.outputs.digest }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Sign exact immutable image digest
        env:
          COSIGN_OIDC_ISSUER: ${{ env.COSIGN_OIDC_ISSUER }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
          if [[ ! "$IMAGE_REF" =~ ^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "Refusing to sign a non-immutable image reference: $IMAGE_REF" >&2
            exit 1
          fi
          cosign sign --yes --oidc-issuer "$COSIGN_OIDC_ISSUER" "$IMAGE_REF"

      - name: Verify exact digest signature and BuildKit attestations
        env:
          COSIGN_OIDC_ISSUER: ${{ env.COSIGN_OIDC_ISSUER }}
          COSIGN_CERTIFICATE_IDENTITY: ${{ env.COSIGN_CERTIFICATE_IDENTITY }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
          cosign verify \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            "$IMAGE_REF"

          # BuildKit publishes SBOM and SLSA provenance as OCI attestation
          # manifests. They are checked separately because BuildKit does not
          # automatically make those referrers Cosign-signed attestations.
          docker buildx imagetools inspect --raw "$IMAGE_REF" > "$RUNNER_TEMP/valorant-image-index.json"
          python3 - "$IMAGE_NAME" "$RUNNER_TEMP/valorant-image-index.json" <<'PY'
          import json
          import re
          import subprocess
          import sys

          repository = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as handle:
              index = json.load(handle)

          attestation_digests = []
          for descriptor in index.get("manifests", []):
              annotations = descriptor.get("annotations", {})
              if annotations.get("vnd.docker.reference.type") != "attestation-manifest":
                  continue
              digest = descriptor.get("digest", "")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"invalid attestation-manifest digest: {digest}")
              attestation_digests.append(digest)

          if not attestation_digests:
              raise SystemExit("expected at least one BuildKit attestation manifest")

          sbom_predicates = {
              "https://spdx.dev/Document",
              "https://cyclonedx.org/bom",
              "https://cyclonedx.org/schema",
              "http://cyclonedx.org/schema",
          }
          provenance_predicates = {
              "https://slsa.dev/provenance/v1",
              "https://slsa.dev/provenance/v0.2",
          }
          found_sbom = set()
          found_provenance = set()
          for digest in attestation_digests:
              referrer = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", f"{repository}@{digest}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              manifest = json.loads(referrer.stdout)
              for layer in manifest.get("layers", []):
                  predicate = layer.get("annotations", {}).get("in-toto.io/predicate-type")
                  if predicate in sbom_predicates:
                      found_sbom.add(predicate)
                  if predicate in provenance_predicates:
                      found_provenance.add(predicate)

          if not found_sbom:
              raise SystemExit("expected an SPDX or CycloneDX SBOM predicate")
          if not found_provenance:
              raise SystemExit("expected an SLSA provenance v1 or v0.2 predicate")
          PY

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PLATFORM_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PLATFORM_SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.PLATFORM_SSH_HOST_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_HOST" && test -n "$SSH_HOST_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.PLATFORM_SSH_HOST }}
          SSH_USER: ${{ secrets.PLATFORM_SSH_USER }}
          APP_DIR: ${{ secrets.PLATFORM_APP_DIR }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' CANONICAL_CHECKOUT_PATH='$CANONICAL_CHECKOUT_PATH' DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_IMAGE='$DEPLOY_IMAGE' bash -s" <<'SCRIPT'
          set -euo pipefail
          if [[ ! "$DEPLOY_IMAGE" =~ ^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "Release image is not an immutable digest: $DEPLOY_IMAGE" >&2
            exit 1
          fi
          if [[ -z "$CANONICAL_CHECKOUT_PATH" || "$APP_DIR" != "$CANONICAL_CHECKOUT_PATH" ]]; then
            echo "Configured checkout path is not the canonical VALORANT path." >&2
            echo "expected=$CANONICAL_CHECKOUT_PATH actual=$APP_DIR" >&2
            exit 1
          fi
          cd "$CANONICAL_CHECKOUT_PATH"
          PREVIOUS_SHA=""
          ENV_FILE="${VALORANT_ENV_FILE:-/etc/quest-esports/valorant-platform.env}"
          RELEASE_LOCK_PATH="${VALORANT_RELEASE_LOCK_PATH:-/var/lock/quest-esports-release.lock}"
          PREVIOUS_IMAGE=""
          METADATA_COMMITTED=false
          TEMP_ENV=""
          ROLLBACK_COMPOSE_DIR=""
          ROLLBACK_COMPOSE_FILE=""
          legacy_units=(valorant-platform.service valorant-updater.service valorant-discord-bot.service)

          rollback() {
            trap - EXIT
            set +e
            echo "Deploy failed; restoring $PREVIOUS_SHA and Compose writers." >&2
            if [[ -n "$TEMP_ENV" ]]; then sudo rm -f "$TEMP_ENV"; fi

            # Stop the new project before returning to the previous checkout.
            # The snapshot is essential on a first deployment, where the
            # previous revision has no production Compose file to execute.
            if [[ -n "$ROLLBACK_COMPOSE_FILE" && -f "$ROLLBACK_COMPOSE_FILE" ]]; then
              export VALORANT_PLATFORM_IMAGE="$DEPLOY_IMAGE"
              if ! docker compose -f "$ROLLBACK_COMPOSE_FILE" --project-name valorant-prod down --remove-orphans; then
                echo "rollback blocked: could not stop the partial Compose project." >&2
                exit 1
              fi
            fi

            if [[ -n "$PREVIOUS_SHA" ]]; then
              git checkout --detach "$PREVIOUS_SHA"
            fi
            if [[ -n "$PREVIOUS_IMAGE" ]]; then
              if ! stop_and_mask_legacy_writers; then
                echo "rollback blocked: legacy writer shutdown could not be proven safe." >&2
                exit 1
              fi
              export VALORANT_PLATFORM_IMAGE="$PREVIOUS_IMAGE"
              docker compose -f docker-compose.production.yml --project-name valorant-prod up -d --no-build --remove-orphans valorant-platform valorant-updater valorant-discord-bot
            else
              echo "No previous image metadata; partial first deployment has been stopped." >&2
            fi
            if [[ "$METADATA_COMMITTED" == true ]]; then
              if [[ -n "$PREVIOUS_IMAGE" ]]; then
                printf 'VALORANT_PLATFORM_IMAGE=%s\n' "$PREVIOUS_IMAGE" | sudo tee "$ENV_FILE" >/dev/null
              else
                sudo rm -f "$ENV_FILE"
              fi
            fi
            if [[ -n "$ROLLBACK_COMPOSE_DIR" ]]; then rm -rf "$ROLLBACK_COMPOSE_DIR"; fi
            exit 1
          }
          trap 'rollback' EXIT

          PREVIOUS_SHA="$(git rev-parse HEAD)"
          if sudo test -r "$ENV_FILE"; then
            PREVIOUS_IMAGE="$(sudo awk -F= '$1 == "VALORANT_PLATFORM_IMAGE" { print substr($0, index($0, "=") + 1); exit }' "$ENV_FILE")"
          fi
          if [[ -n "$PREVIOUS_IMAGE" && ! "$PREVIOUS_IMAGE" =~ ^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "Persistent deployment image metadata is invalid; refusing cutover."
            exit 1
          fi

          if ! git fetch --prune origin "$DEPLOY_SHA"; then
            echo "Could not fetch origin $DEPLOY_SHA." >&2
            exit 1
          fi
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

          # Preserve the new deployment boundary before any lock or service
          # operation. This remains usable after the checkout is rolled back.
          ROLLBACK_COMPOSE_DIR="$(mktemp -d /tmp/valorant-prod-rollback.XXXXXX)"
          ROLLBACK_COMPOSE_FILE="$ROLLBACK_COMPOSE_DIR/docker-compose.production.yml"
          cp --preserve=mode,timestamps docker-compose.production.yml "$ROLLBACK_COMPOSE_FILE"

          if ! sudo test -e "$RELEASE_LOCK_PATH"; then
            sudo install -o "$(id -un)" -g 10001 -m 0660 /dev/null "$RELEASE_LOCK_PATH"
          else
            sudo chown "$(id -un)":10001 "$RELEASE_LOCK_PATH"
            sudo chmod 0660 "$RELEASE_LOCK_PATH"
          fi
          exec 9>"$RELEASE_LOCK_PATH"
          flock 9

          legacy_unit_state() {
            local unit="$1"
            local property="$2"
            local value
            if ! value="$(sudo systemctl show "$unit" --property="$property" --value)"; then
              echo "cannot inspect legacy unit $unit ($property); aborting" >&2
              return 1
            fi
            printf '%s' "$value"
          }

          stop_and_mask_legacy_writers() {
            local unit load_state active_state unit_file_state
            for unit in "${legacy_units[@]}"; do
              echo "legacy unit inventory: $unit"
              if ! load_state="$(legacy_unit_state "$unit" LoadState)"; then return 1; fi
              echo "  load-state=$load_state"
              if [[ "$load_state" == not-found ]]; then
                continue
              fi
              if [[ "$load_state" != loaded && "$load_state" != masked ]]; then
                echo "legacy unit $unit has unusable load state: $load_state" >&2
                return 1
              fi
              if ! active_state="$(legacy_unit_state "$unit" ActiveState)"; then return 1; fi
              if ! unit_file_state="$(legacy_unit_state "$unit" UnitFileState)"; then return 1; fi
              echo "  active-state=$active_state unit-file-state=$unit_file_state"
              if [[ "$active_state" != inactive ]]; then
                if ! sudo systemctl stop "$unit"; then
                  echo "failed to stop legacy unit: $unit" >&2
                  return 1
                fi
              fi
              if [[ "$load_state" != masked ]]; then
                if ! sudo systemctl disable "$unit"; then
                  echo "failed to disable legacy unit: $unit" >&2
                  return 1
                fi
                if ! sudo systemctl mask "$unit"; then
                  echo "failed to mask legacy unit: $unit" >&2
                  return 1
                fi
              fi
              if ! active_state="$(legacy_unit_state "$unit" ActiveState)"; then return 1; fi
              if [[ "$active_state" != inactive ]]; then
                echo "legacy unit remains active: $unit ($active_state)" >&2
                return 1
              fi
            done
          }

          export VALORANT_PLATFORM_IMAGE="$DEPLOY_IMAGE"
          python3 scripts/validate_release_image.py true

          SERVICES="valorant-platform valorant-updater valorant-discord-bot"
          docker compose -f docker-compose.production.yml --project-name valorant-prod config >/dev/null
          docker compose -f docker-compose.production.yml --project-name valorant-prod pull $SERVICES

          # Legacy systemd writers are stopped and masked before Compose starts.
          if ! stop_and_mask_legacy_writers; then
            echo "cutover blocked: legacy writer shutdown could not be proven safe." >&2
            exit 1
          fi

          docker compose -f docker-compose.production.yml --project-name valorant-prod up -d --no-build --remove-orphans $SERVICES
          HEALTHY=false
          for attempt in 1 2 3 4 5; do
            if docker compose -f docker-compose.production.yml --project-name valorant-prod exec -T valorant-platform curl --fail --silent --show-error --max-time 10 \
              --cacert /run/valorant-tls/quest-private-ca.crt \
              --resolve valorant-platform:8000:127.0.0.1 \
              https://valorant-platform:8000/api/v1/health \
              | docker compose -f docker-compose.production.yml --project-name valorant-prod exec -T valorant-platform /app/.venv/bin/python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("status") == "ok" and d.get("db") == "up" else 1)'; then
              HEALTHY=true
              break
            fi
            sleep 2
          done
          test "$HEALTHY" = true

          # Commit the digest only after the new Compose services pass health.
          sudo install -d -m 0750 /etc/quest-esports
          TEMP_ENV="$(sudo mktemp /etc/quest-esports/.valorant-platform.env.XXXXXX)"
          printf 'VALORANT_PLATFORM_IMAGE=%s\n' "$DEPLOY_IMAGE" | sudo tee "$TEMP_ENV" >/dev/null
          sudo chown root:root "$TEMP_ENV"
          sudo chmod 0640 "$TEMP_ENV"
          sudo mv -f "$TEMP_ENV" "$ENV_FILE"
          TEMP_ENV=""
          METADATA_COMMITTED=true
          if [[ -n "$ROLLBACK_COMPOSE_DIR" ]]; then rm -rf "$ROLLBACK_COMPOSE_DIR"; fi
          trap - EXIT
          SCRIPT
